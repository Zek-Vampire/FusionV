# One-command PostgreSQL for FusionV:   docker compose up -d
# First start creates the database "fusionv", runs database/init/*.sql (tables + demo data),
# and keeps data in the named volume "fusionv_pgdata" (survives restarts).
# To wipe everything and start fresh:    docker compose down -v
services:
  db:
    image: postgres:16
    container_name: fusionv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fusionv
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - fusionv_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d fusionv"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fusionv_pgdata:
